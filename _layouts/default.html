<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url == '/' %}{{ site.title }} · Mathematics, Boise State University{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#0B1F3A">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <link rel="preload" href="{{ '/assets/fonts/source-serif-4-latin-600-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script>document.documentElement.className = 'js';</script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" data-header>
    <div class="wrap site-header__in">
      <a class="brand" href="{{ '/' | relative_url }}">Grady B. Wright</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle>
        <span class="nav-toggle__label">Menu</span>
        <span class="nav-toggle__bars" aria-hidden="true"></span>
      </button>
      <nav id="site-nav" class="site-nav" aria-label="Primary" data-nav>
        <ul>
          {% for item in site.data.nav %}
          <li><a href="{{ item.url | relative_url }}"{% if item.external %} class="is-external" target="_blank" rel="noopener noreferrer"{% endif %}{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
          {% endfor %}
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap site-footer__in">
      <div>
        <p class="site-footer__name">Grady B. Wright</p>
        <address>
          Professor<br>
          <a href="https://www.boisestate.edu/math/">Department of Mathematics</a><br>
          <a href="https://www.boisestate.edu/computing/">Computing Ph.D. Program</a><br>
          <a href="https://www.boisestate.edu">Boise State University</a><br>
          Boise, Idaho, USA
        </address>
      </div>
      <div class="site-footer__contact">
        <p class="site-footer__label">Contact</p>
        <p><a href="mailto:gradywright@boisestate.edu">gradywright@boisestate.edu</a></p>
      </div>
    </div>
  </footer>

  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
